<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" fill="url(#bgGradient)"/>
  
  <!-- Main grid container -->
  <g transform="translate(96, 96)" stroke="#333333" stroke-width="3" fill="none">
    <!-- Outer border -->
    <rect x="0" y="0" width="320" height="320" rx="16" fill="#ffffff"/>
    
    <!-- Grid lines -->
    <g stroke-opacity="0.2">
      <path d="M80,0 L80,320"/>
      <path d="M160,0 L160,320"/>
      <path d="M240,0 L240,320"/>
      <path d="M0,80 L320,80"/>
      <path d="M0,160 L320,160"/>
      <path d="M0,240 L320,240"/>
    </g>
    
    <!-- Mine -->
    <g transform="translate(240, 240)">
      <!-- Explosion effect (background) -->
      <g fill="#ff4444" fill-opacity="0.3">
        <circle r="32" cx="0" cy="0"/>
        <circle r="40" cx="0" cy="0"/>
        <circle r="48" cx="0" cy="0"/>
      </g>
      
      <!-- Main body -->
      <circle r="32" fill="#333333"/>
      <circle r="28" fill="#222222"/>
      
      <!-- Spikes -->
      <g stroke="#ff4444" stroke-width="3">
        <line x1="0" y1="-32" x2="0" y2="-44"/>
        <line x1="22.6" y1="-22.6" x2="32" y2="-32"/>
        <line x1="32" y1="0" x2="44" y2="0"/>
        <line x1="22.6" y1="22.6" x2="32" y2="32"/>
        <line x1="0" y1="32" x2="0" y2="44"/>
        <line x1="-22.6" y1="22.6" x2="-32" y2="32"/>
        <line x1="-32" y1="0" x2="-44" y2="0"/>
        <line x1="-22.6" y1="-22.6" x2="-32" y2="-32"/>
      </g>
      
      <!-- Inner details -->
      <circle r="16" fill="#ff4444" fill-opacity="0.5"/>
      <circle r="8" fill="#ffffff"/>
    </g>
    
    <!-- Flag -->
    <g transform="translate(80, 80)">
      <path d="M0,0 L24,0 L12,12 Z" fill="#4CAF50"/>
      <rect x="0" y="0" width="3" height="24" fill="#333333"/>
    </g>
    
    <!-- Number 1 -->
    <g transform="translate(40, 40)">
      <text x="0" y="0" font-family="Arial" font-size="32" font-weight="bold" fill="#2196F3" text-anchor="middle" dominant-baseline="middle">1</text>
    </g>
  </g>
  
  <!-- Decorative elements -->
  <g fill="#333333" fill-opacity="0.05">
    <circle cx="64" cy="64" r="32"/>
    <circle cx="448" cy="448" r="32"/>
  </g>
</svg> 
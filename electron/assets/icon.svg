<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EAEAEA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DADADA;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="explosionGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#ff0000;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#ff4444;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#ff0000;stop-opacity:0" />
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect x="0" y="0" width="512" height="512" rx="128" ry="128" fill="url(#bgGradient)"/>
  
  <!-- Explosion effect -->
  <g transform="translate(256, 256)">
    <!-- Main explosion -->
    <circle r="200" fill="url(#explosionGradient)" filter="url(#glow)"/>
    
    <!-- Explosion particles -->
    <g stroke="#ff0000" stroke-width="4" fill="none">
      <path d="M0,0 L100,-100" stroke-opacity="0.8"/>
      <path d="M0,0 L-100,-100" stroke-opacity="0.8"/>
      <path d="M0,0 L100,100" stroke-opacity="0.8"/>
      <path d="M0,0 L-100,100" stroke-opacity="0.8"/>
      <path d="M0,0 L0,-150" stroke-opacity="0.8"/>
      <path d="M0,0 L0,150" stroke-opacity="0.8"/>
      <path d="M0,0 L150,0" stroke-opacity="0.8"/>
      <path d="M0,0 L-150,0" stroke-opacity="0.8"/>
    </g>
    
    <!-- Bomb body -->
    <g transform="translate(0, 20)">
      <!-- Main sphere -->
      <circle r="100" fill="#333333"/>
      <circle r="90" fill="#222222"/>
      
      <!-- Fuse -->
      <path d="M0,-100 C-30,-140 -40,-180 -20,-220" stroke="#ff0000" stroke-width="6" fill="none"/>
      <circle cx="-20" cy="-220" r="10" fill="#ff0000"/>
      
      <!-- Spikes -->
      <g fill="#000000">
        <!-- Main spikes -->
        <path d="M-8,-100 L0,-130 L8,-100 Z"/>
        <path d="M70.7,-70.7 L91.9,-91.9 L78.7,-63.7 Z"/>
        <path d="M100,0 L130,0 L100,8 Z"/>
        <path d="M70.7,70.7 L91.9,91.9 L78.7,63.7 Z"/>
        <path d="M-8,100 L0,130 L8,100 Z"/>
        <path d="M-70.7,70.7 L-91.9,91.9 L-78.7,63.7 Z"/>
        <path d="M-100,0 L-130,0 L-100,8 Z"/>
        <path d="M-70.7,-70.7 L-91.9,-91.9 L-78.7,-63.7 Z"/>
        
        <!-- Additional spikes -->
        <path d="M42,-86.6 L65,-112.6 L58,-79.6 Z"/>
        <path d="M86.6,-50 L112.6,-65 L79.6,-58 Z"/>
        <path d="M86.6,50 L112.6,65 L79.6,58 Z"/>
        <path d="M42,86.6 L65,112.6 L58,79.6 Z"/>
        <path d="M-42,86.6 L-65,112.6 L-58,79.6 Z"/>
        <path d="M-86.6,50 L-112.6,65 L-79.6,58 Z"/>
        <path d="M-86.6,-50 L-112.6,-65 L-79.6,-58 Z"/>
        <path d="M-42,-86.6 L-65,-112.6 L-58,-79.6 Z"/>
      </g>
      
      <!-- Inner details -->
      <circle r="50" fill="#ff0000" fill-opacity="0.7"/>
      <circle r="25" fill="#ffffff"/>
    </g>
  </g>
</svg> 